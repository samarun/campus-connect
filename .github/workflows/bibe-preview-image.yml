name: Build BIBE preview image

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  packages: write

jobs:
  publish-preview-image:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bibe-preview')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./campus-connect-web
          file: ./campus-connect-web/Dockerfile
          push: true
          tags: ghcr.io/samarun/campus-connect-web:sha-${{ github.event.pull_request.head.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

  preview-route-check:
    name: Preview HTTPS route reachable
    needs: publish-preview-image
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bibe-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for DNS, TLS and Basic Auth challenge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="https://campus-connect-pr-${PR_NUMBER}.git.arunsamuel.com/"
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "$url" || true)
            if [[ "$status" == "401" ]]; then
              echo "Authenticated preview route reachable over verified HTTPS: $url"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status}; waiting for reconciliation"
            sleep 10
          done
          echo "Preview route did not become reachable: $url" >&2
          exit 1
