[outputs.local-program]
kind = "srt"
url = "srt://localhost:9999?streamid=default/broadcast/program"
srt_latency_ms = 120
srt_mode = "caller"

[outputs.local-test]
kind = "srt"
url = "srt://localhost:9999?streamid=default/broadcast/test"
srt_latency_ms = 120
srt_mode = "caller"

[outputs.production-program]
kind = "srt"
url = "srt://stream.example.com:9999?streamid=default/broadcast/program"
srt_latency_ms = 120
srt_mode = "caller"

[outputs.local-recording]
kind = "file"
url = "capture-bridge/output/capture-test.ts"

[outputs.rtc-whip-placeholder]
kind = "whip"
url = "https://rtc.example.com/whip"

[profiles.program-local-srt]
purpose = "program"
backend = "avfoundation"
video_device = "1"
audio_device = "2"
format = "1080p30"
output = "local-program"
encoder = "h264-videotoolbox"
safe_mode = true

[profiles.program-local-srt.macos]
backend = "avfoundation"
video_device = "1"
audio_device = "2"
encoder = "h264-videotoolbox"

[profiles.program-local-srt.linux]
backend = "v4l2"
video_device = "/dev/video0"
audio_device = "default"
encoder = "libx264"

[profiles.program-test-pattern]
purpose = "program-test"
backend = "lavfi"
video_device = "testsrc2"
format = "1080p30"
output = "local-program"
encoder = "libx264"
safe_mode = true

[profiles.relay-test-pattern]
purpose = "relay-test"
backend = "lavfi"
video_device = "testsrc2"
format = "1080p30"
output = "local-test"
encoder = "libx264"
safe_mode = true

[profiles.program-decklink-srt]
purpose = "program"
backend = "decklink"
video_device = "DeckLink Mini Recorder 4K"
format = "1080p30"
output = "production-program"
encoder = "libx264"
safe_mode = false

[profiles.program-decklink-srt.macos]
backend = "decklink"
video_device = "DeckLink Mini Recorder 4K"
encoder = "libx264"

[profiles.program-decklink-srt.linux]
backend = "gstreamer-decklink"
video_device = "0"
audio_device = "hw:0"
encoder = "libx264"

[profiles.linux-rack-v4l2-srt]
purpose = "program"
backend = "v4l2"
video_device = "/dev/video0"
audio_device = "default"
format = "1080p30"
output = "production-program"
encoder = "libx264"
safe_mode = true

[profiles.linux-rack-gstreamer-srt]
purpose = "program"
backend = "gstreamer-v4l2"
video_device = "/dev/video0"
audio_device = "default"
format = "1080p30"
output = "production-program"
encoder = "libx264"
safe_mode = true

[profiles.greeting-whip-placeholder]
purpose = "greeting"
backend = "gstreamer-decklink"
video_device = "DeckLink Mini Recorder 4K"
format = "1080p30"
output = "rtc-whip-placeholder"
encoder = "libx264"
safe_mode = false
