port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
  turn_servers:
    - host: ${TURN_DOMAIN}
      port: 3478
      protocol: udp
      secret: ${TURN_STATIC_AUTH_SECRET}
      ttl: 14400
    - host: ${TURN_DOMAIN}
      port: 5349
      protocol: tls
      secret: ${TURN_STATIC_AUTH_SECRET}
      ttl: 14400

redis:
  address: 127.0.0.1:6379

keys:
  ${RTC_API_KEY}: ${RTC_API_SECRET}

prometheus_port: 6789

ingress:
  rtmp_base_url: rtmp://${RTC_DOMAIN}:1935/live
  whip_base_url: https://${RTC_DOMAIN}/whip

room:
  auto_create: true
